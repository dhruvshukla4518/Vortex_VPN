<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="vortexGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="60%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield Silhouette -->
  <path d="M60 12 C85 12 104 22 104 46 C104 78 60 108 60 108 C60 108 16 78 16 46 C16 22 35 12 60 12 Z" 
        fill="#111318" stroke="url(#vortexGlow)" stroke-width="3" filter="url(#glow)"/>

  <!-- Concentric Orbital Vortex Rings -->
  <circle cx="60" cy="54" r="26" fill="none" stroke="#00E5FF" stroke-width="2" stroke-dasharray="8 6 16 6" opacity="0.85"/>
  <circle cx="60" cy="54" r="18" fill="none" stroke="#4F46E5" stroke-width="2.5" stroke-dasharray="12 8" opacity="0.9"/>
  <circle cx="60" cy="54" r="10" fill="none" stroke="#10B981" stroke-width="2" stroke-dasharray="4 4" opacity="0.9"/>

  <!-- Center Core Star / Lock Node -->
  <circle cx="60" cy="54" r="4.5" fill="#00E5FF" filter="url(#glow)"/>
</svg>
