[project]
name = "vortex-vpn"
version = "1.0.0"
description = "VORTEX VPN — Production-grade WireGuard VPN & DNS Privacy Blocker"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.30",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.8.0",
    "cryptography>=42.0.0",
    "httpx>=0.27.0",
    "dnspython>=2.6.0",
    "psutil>=6.0.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "streamlit>=1.36.0",
    "plotly>=5.22.0",
    "pandas>=2.2.0",
    "email-validator>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [".", "dns-blocker", "server-agent"]
testpaths = ["backend/tests", "dns-blocker/tests", "server-agent/tests"]
python_files = ["test_*.py"]
